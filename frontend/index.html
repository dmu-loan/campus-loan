<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#162f57" />
    <title>빌려드립니다</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>화면을 이용하려면 JavaScript를 활성화해 주세요.</noscript>
    <template id="student-template">
<div class="student-shell">
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <header class="student-header"><a class="brand" href="/" aria-label="빌려드립니다 학생 홈">
  <span class="brand-mark" aria-hidden="true">빌</span>
  <span><strong>빌려드립니다</strong><small>한울타리 총학생회</small></span>
</a></header>
  <main id="main-content" class="student-main" tabindex="-1">
    <section class="student-intro" aria-labelledby="student-title">
      <p class="eyebrow">CAMPUS LOAN</p>
      <h1 id="student-title">필요할 때,<br />빌려드립니다.</h1>
      <p class="muted">학교생활에 필요한 물품을<br />한울타리 총학생회에서 만나보세요.</p>
    </section>
    <p class="demo-notice">화면 미리보기 · 물품과 수량은 예시이며 실제 재고가 아닙니다.</p>
    <section aria-labelledby="items-title">
      <h2 id="items-title">대여 물품</h2>
      <ul class="item-list" id="item-list"></ul>

    </section>
  </main>
  <footer class="student-footer">동양미래대학교 한울타리 총학생회</footer>
</div>
    </template>
    <template id="admin-template">
<div class="admin-shell">
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <aside class="admin-sidebar">
    <a class="brand" href="/admin" aria-label="빌려드립니다 관리자 홈">
  <span class="brand-mark" aria-hidden="true">빌</span>
  <span><strong>빌려드립니다</strong><small>총학생회 관리 페이지</small></span>
</a>
    <nav class="admin-nav" aria-label="관리자 메뉴">
      <a href="/admin" aria-current="page">대시보드</a>
    </nav>
    <a class="student-link" href="/">학생 페이지 보기 ↗</a>
  </aside>
  <div class="admin-body">
    <header class="admin-header">
      <span>물품 대여 관리</span>
      <span class="preview-badge">화면 미리보기</span>
    </header>
    <main id="main-content" class="admin-main" tabindex="-1">
      <div class="page-heading">
        <p class="eyebrow">OVERVIEW</p>
        <h1>대시보드</h1>
        <p class="muted">대여 신청부터 반납까지 한곳에서 관리하세요.</p>
      </div>
      <section class="panel" aria-labelledby="admin-status-title">
        <h2 id="admin-status-title">대여 현황</h2>
        <div class="empty-state">
          <span class="empty-symbol" aria-hidden="true">≡</span>
          <p>관리 서비스를 준비하고 있습니다.</p>
          <p class="muted">신청 내역과 대여 현황이 이곳에 표시됩니다.</p>
        </div>
      </section>
    </main>
  </div>
</div>
    </template>

    <template id="item-card-template">
      <li>
        <button class="item-card" type="button" aria-haspopup="dialog">
          <span class="item-symbol" aria-hidden="true"></span>
          <span class="item-info"><strong data-field="name"></strong><span class="muted" data-field="summary"></span></span>
          <span class="item-stock"><strong data-field="available"></strong><span data-field="status"></span></span>
          <span aria-hidden="true">›</span>
        </button>
      </li>
    </template>
    <template id="item-detail-template">
      <dialog class="item-dialog" aria-labelledby="item-detail-title" aria-describedby="item-detail-description">
        <div class="dialog-heading">
          <h2 id="item-detail-title"></h2>
          <button class="close-dialog" type="button" autofocus>닫기</button>
        </div>
        <p id="item-detail-description"></p>
        <dl class="item-facts">
          <div><dt>전체 수량</dt><dd data-field="total"></dd></div>
          <div><dt>대여 중</dt><dd data-field="rented"></dd></div>
          <div><dt>대여 가능</dt><dd data-field="available"></dd></div>
          <div><dt>반납 안내</dt><dd data-field="returnGuide"></dd></div>
        </dl>
        <p class="item-caution"></p>
        <p class="muted">물품 정보와 반납 안내는 화면 개발용 예시입니다.</p>
        <button class="apply-placeholder" type="button" disabled></button>
      </dialog>
    </template>
    <template id="apply-template">
      <div class="student-shell">
        <a class="skip-link" href="#main-content">본문 바로가기</a>
        <header class="student-header"><a href="/">← 학생 홈</a></header>
        <main id="main-content" class="student-main" tabindex="-1">
          <h1>대여 신청</h1>
          <p class="demo-notice">신청 체험 화면입니다. 실제 접수·예약은 이루어지지 않으며 입력 정보는 저장하지 않습니다.</p>
          <ol class="apply-progress" aria-label="신청 단계">
            <li aria-current="step">1. 이용 안내</li><li>2. 정보 입력</li><li>3. 내용 확인</li>
          </ol>
          <form id="rental-form" novalidate>
            <section data-step="0">
              <h2 tabindex="-1">이용 전에 확인해 주세요</h2>
              <div class="panel apply-guide">
                <p>물품을 선택하고 신청 정보를 입력한 뒤 내용을 확인합니다.</p>
                <p>실제 서비스에서는 신청 이후 담당자의 확인과 승인이 필요합니다.</p>
                <p>수령 장소·보증금·반납 기한은 실제 운영 안내를 확인해 주세요.</p>
              </div>
              <label class="check-row"><input type="checkbox" name="understood" aria-describedby="understood-error" /> 실제 접수가 아닌 체험 화면임을 확인했습니다.</label>
              <p id="understood-error" class="field-error"></p>
            </section>
            <section data-step="1" hidden>
              <h2 tabindex="-1">신청 정보를 입력해 주세요</h2>
              <div class="form-field"><label for="department">학과</label><input id="department" name="department" maxlength="80" autocomplete="off" aria-describedby="department-error" /><p id="department-error" class="field-error"></p></div>
              <div class="form-field"><label for="studentNo">학번</label><input id="studentNo" name="studentNo" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="8자리 숫자" aria-describedby="studentNo-error" /><p id="studentNo-error" class="field-error"></p></div>
              <div class="form-field"><label for="name">이름</label><input id="name" name="name" maxlength="50" autocomplete="name" aria-describedby="name-error" /><p id="name-error" class="field-error"></p></div>
              <div class="form-field"><label for="phone">휴대전화 번호</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="010-1234-5678" aria-describedby="phone-error" /><p id="phone-error" class="field-error"></p></div>
              <div class="form-field"><label for="itemId">신청 물품</label><select id="itemId" name="itemId" aria-describedby="itemId-error"><option value="">물품을 선택해 주세요</option></select><p id="itemId-error" class="field-error"></p></div>
            </section>
            <section data-step="2" hidden>
              <h2 tabindex="-1">신청 내용을 확인해 주세요</h2>
              <dl class="item-facts" id="application-summary"></dl>
              <p class="muted">수정할 내용이 있다면 이전 단계로 돌아가세요.</p>
            </section>
            <p id="apply-status" role="alert" class="field-error"></p>
            <div class="apply-actions"><button type="button" id="apply-back" class="secondary-button" hidden>이전</button><button type="submit" id="apply-next" class="primary-button">다음으로</button></div>
          </form>
          <section id="apply-complete" hidden>
            <h2 tabindex="-1">신청 체험을 완료했어요</h2>
            <p>실제 대여 신청은 접수되지 않았습니다.</p>
            <p class="muted">입력 내용은 서버로 전송하거나 이 기기에 저장하지 않았습니다.</p>
            <a class="primary-button" href="/">학생 홈으로 돌아가기</a>
          </section>
        </main>
        <footer class="student-footer">동양미래대학교 한울타리 총학생회</footer>
      </div>
    </template>
    <template id="not-found-template">
      <main class="not-found">
        <h1>페이지를 찾을 수 없어요</h1>
        <p class="muted">주소를 확인하거나 첫 화면으로 이동해 주세요.</p>
        <a href="/">학생 홈으로 이동</a>
      </main>
    </template>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
