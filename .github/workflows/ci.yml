name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 바뀐 영역과 프로젝트 존재 여부를 확인합니다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        name: 변경 영역 감지
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$'; then
            BASE="$PUSH_BEFORE"
          else
            BASE=""
          fi

          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" HEAD)
          else
            CHANGED=$(git ls-files)
          fi
          echo "변경된 파일:"
          echo "$CHANGED"

          backend=false
          frontend=false
          if echo "$CHANGED" | grep -qE '^(backend/|\.github/workflows/ci\.yml$)'; then backend=true; fi
          if echo "$CHANGED" | grep -qE '^(frontend/|\.github/workflows/ci\.yml$)'; then frontend=true; fi

          # 아직 프로젝트가 생성되지 않았으면 건너뜁니다.
          [ -f backend/gradlew ] || backend=false
          [ -f frontend/package.json ] || frontend=false

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend, frontend=$frontend"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: 테스트·검사
        run: |
          chmod +x gradlew
          ./gradlew check --no-daemon

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # Rulesets의 필수 체크로 이 job 하나만 지정합니다.
  ci-result:
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "결과: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "실패한 검사가 있습니다."
              exit 1
            fi
          done
          echo "모든 검사 통과 (건너뛴 검사 포함)"
