name: 버그
description: 잘못 동작하는 부분을 신고합니다.
title: "[버그] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - BE
        - FE
        - 모름
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 에러 메시지나 스크린샷이 있으면 함께 붙여 주세요.
    validations:
      required: true
