name: 기능
description: 새 기능이나 개선 작업을 등록합니다.
title: "[기능] "
labels: ["feature"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - BE
        - FE
        - BE + FE
        - 공통
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 무엇을, 왜 만드는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API 변경
      description: 추가·변경되는 API가 있으면 경로와 요청·응답 예시를 적어 주세요. 없으면 "없음".
      placeholder: "GET /api/items → [{ \"id\": 1, \"title\": \"우산\", \"available\": 3 }]"
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 이 항목들이 끝나면 이슈를 닫습니다.
      value: |
        - [ ]
    validations:
      required: true
